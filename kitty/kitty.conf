# ==========================================
# COLOR THEME
# ==========================================
# Colours are generated by matugen from the active wallpaper
# (see scripts/apply-theme.sh). The include is placed AFTER the static
# fallback palette below so the generated colours win when present, while a
# fresh install with no wallpaper yet still has a sane dark palette.
# ==========================================
# FONTS
# ==========================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ==========================================
# WINDOW & PADDING
# ==========================================
window_padding_width 12
remember_window_size  no
initial_window_width  820
initial_window_height 500
background_opacity 0.92
hide_window_decorations yes

# ==========================================
# TAB BAR
# ==========================================
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# ==========================================
# STATIC FALLBACK PALETTE (Catppuccin Mocha)
# Overridden by the matugen include at the bottom of this file.
# ==========================================
foreground     #cdd6f4
background     #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc

cursor         #f5e0dc
cursor_text_color #1e1e2e

url_color      #f5e0dc

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2 #a6e3a1
color10 #a6e3a1

# Yellow
color3 #f9e2af
color11 #f9e2af

# Blue
color4 #89b4fa
color12 #89b4fa

# Magenta
color5 #f5c2e7
color13 #f5c2e7

# Cyan
color6 #94e2d5
color14 #94e2d5

# White
color7 #bac2de
color15 #a6adc8

# ==========================================
# DYNAMIC THEME (matugen) — must stay last.
# ==========================================
include ~/.local/state/theme/generated/kitty.conf
