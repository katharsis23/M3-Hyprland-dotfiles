add_newline = false
format = """
$cmd_duration $directory$git_branch
  $character"""

[character]
error_symbol = "[ ](bold fg:{{colors.error.default.hex}})"
success_symbol = "[ ](bold fg:{{colors.primary.default.hex}})"

[cmd_duration]
format = "[](bold fg:{{colors.primary_container.default.hex}})[󰪢 $duration](bold bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}})[](bold fg:{{colors.primary_container.default.hex}})"
min_time = 0

[directory]
format = "[](bold fg:{{colors.primary.default.hex}})[󰉋 → $path]($style)[](bold fg:{{colors.primary.default.hex}})"
home_symbol = " "
read_only = "  "
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
truncation_length = 2
truncation_symbol = ".../"

[directory.substitutions]
Desktop = "  "
Documents = "  "
Downloads = "  "
GitHub = " 󰊤 "
Music = " 󰎈 "
Pictures = "  "
Videos = "  "

[git_branch]
format = " 󰜥 [](bold fg:{{colors.secondary_container.default.hex}})[$symbol $branch(:$remote_branch)](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})[ ](bold fg:{{colors.secondary_container.default.hex}})"
style = "bg:{{colors.secondary_container.default.hex}}"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_status]
staged = '[++\($count\)]({{colors.primary.default.hex}})'

[line_break]
disabled = false

[package]
disabled = true

[username]
format = "[](bold fg:{{colors.primary_container.default.hex}})[$user]($style)"
show_always = true
style_user = "bold bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
style_root = "bold {{colors.error.default.hex}}"