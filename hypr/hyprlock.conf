      ### VARIABLES ###
# Fix wallpaper and fonts
$wallpaper = $HOME/Pictures/Wallpapers/wallpaper.png
$font      = JetBrainsMono Nerd Font

# Catppuccin Mocha reference:
# base     1e1e2e   crust    11111b   surface0 313244
# text     cdd6f4   subtext0 a6adc8   overlay0 6c7086
# mauve    cba6f7   lavender b4befe   pink     f5c2e7
# red      f38ba8   green    a6e3a1   yellow   f9e2af
# peach    fab387   blue     89b4fa

####################
###   GENERAL    ###
####################

general {
    no_fade_in = true
    no_fade_out = false
    disable_loading_bar = true
    grace = 1
    hide_cursor = true
}

####################
###  BACKGROUND  ###
####################

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.18
    vibrancy_darkness = 0.15
}

############################
###      LEFT COLUMN     ###
############################

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = rgba(17, 17, 27, 0.45)
    rounding = 25
    border_size = 1
    border_color = rgba(180, 190, 254, 0.25)
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

# FACE IMAGE
image {
    monitor =
    path = $HOME/.face
    size = 120
    rounding = 60
    border_size = 3
    border_color = rgba(203, 166, 247, 0.9)
    position = -200, 250
    halign = center
    valign = center
    zindex = 2
}

# USERNAME
label {
    monitor =
    text = cmd[update:1000] echo "$USER"
    color = rgba(205, 214, 244, 1.0)
    font_size = 22
    font_family = $font Bold
    position = -200, 155
    halign = center
    valign = center
    zindex = 3
}

# Password label
label {
    monitor =
    text = PASSWORD
    color = rgba(166, 173, 200, 0.85)
    font_size = 10
    font_family = $font Bold
    position = -310, 75
    halign = left
    valign = center
    zindex = 3
}

# Password input
input-field {
    monitor =
    size = 320, 68
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(180, 190, 254, 0.6)
    inner_color = rgba(30, 30, 46, 0.55)

    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)

    fail_text = <i>$FAIL</i>
    capslock_color = rgba(249, 226, 175, 0.9)

    fade_on_empty = false
    hide_input = false

    placeholder_text = <i><span foreground="##6c7086">Enter Password</span></i>

    rounding = 20

    position = -200, 35
    halign = center
    valign = center
    zindex = 2
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = rgba(17, 17, 27, 0.45)
    rounding = 25
    border_size = 1
    border_color = rgba(180, 190, 254, 0.25)
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

# CLOCK
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(205, 214, 244, 1.0)
    font_size = 68
    font_family = $font ExtraBold
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

# UPTIME
label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /󰅐  UPTIME /' -e 's/ hours\?, \?/H /' -e 's/ minutes\?/M/'
    color = rgba(166, 173, 200, 0.85)
    font_size = 13
    font_family = $font
    position = -200, -195
    halign = center
    valign = center
    zindex = 2
}

############################
###     RIGHT COLUMN     ###
############################

# PROFILE CARD
shape {
    monitor =
    size = 360, 380
    color = rgba(17, 17, 27, 0.45)
    rounding = 25
    border_size = 1
    border_color = rgba(180, 190, 254, 0.25)
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

# PROFILE AVATAR
image {
    monitor =
    path = $HOME/Pictures/Wallpapers/avatar.jpg
    size = 120
    rounding = 60
    border_size = 3
    border_color = rgba(203, 166, 247, 0.9)
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

# DAY
label {
    monitor =
    text = cmd[update:1000] date +"%A" | tr '[:lower:]' '[:upper:]'
    color = rgba(205, 214, 244, 1.0)
    font_size = 34
    font_family = $font ExtraBold
    position = 200, 155
    halign = center
    valign = center
    zindex = 2
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%d %B, %Y"
    color = rgba(166, 173, 200, 0.85)
    font_size = 13
    font_family = $font
    position = 200, 105
    halign = center
    valign = center
    zindex = 2
}

############################
### SYSTEM / MEDIA CARD  ###
############################

shape {
    monitor =
    size = 360, 320
    color = rgba(17, 17, 27, 0.55)
    rounding = 25
    border_size = 1
    border_color = rgba(180, 190, 254, 0.25)

    position = 200, -140

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)

    zindex = 10
}

############################
###       MEDIA          ###
############################

# PLAYBACK STATUS ICON
label {
    monitor =
    text = cmd[update:1000] s=$(playerctl status 2>/dev/null); case "$s" in Playing) echo "󰐊";; Paused) echo "󰏤";; *) echo "󰎆";; esac
    color = rgba(203, 166, 247, 1.0)
    font_size = 18
    font_family = $font
    position = 200, -10
    halign = center
    valign = center
    zindex = 11
}

# TRACK TITLE
label {
    monitor =
    text = cmd[update:1000] t=$(playerctl metadata xesam:title 2>/dev/null); [ -z "$t" ] && echo "No Music Playing" || printf '%.26s\n' "$t"
    color = rgba(205, 214, 244, 1.0)
    font_size = 14
    font_family = $font Bold
    position = 200, -38
    halign = center
    valign = center
    zindex = 11
}

# ARTIST
label {
    monitor =
    text = cmd[update:1000] a=$(playerctl metadata xesam:artist 2>/dev/null); [ -z "$a" ] && echo "" || printf '%.30s\n' "$a"
    color = rgba(166, 173, 200, 0.85)
    font_size = 12
    font_family = $font
    position = 200, -58
    halign = center
    valign = center
    zindex = 11
}

############################
###       WI-FI          ###
############################

shape {
    monitor =
    size = 150, 75
    color = rgba(250, 179, 135, 0.9)
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

# Wi-Fi icon
label {
    monitor =
    text = cmd[update:5000] echo "󰤨"
    color = rgba(17, 17, 27, 0.75)
    font_size = 18
    font_family = $font
    position = 115, -118
    halign = center
    valign = center
    zindex = 12
}

# Wi-Fi SSID
label {
    monitor =
    text = cmd[update:5000] w=$(iw dev 2>/dev/null | awk '$1=="ssid"{print $2; exit}' | cut -c1-14); [ -z "$w" ] && echo "Disconnected" || echo "$w"
    color = rgba(17, 17, 27, 0.75)
    font_size = 10
    font_family = $font Bold
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

############################
###      BLUETOOTH       ###
############################

shape {
    monitor =
    size = 150, 75
    color = rgba(250, 179, 135, 0.9)
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

# Bluetooth icon
label {
    monitor =
    text = cmd[update:5000] echo "󰂯"
    color = rgba(17, 17, 27, 0.75)
    font_size = 18
    font_family = $font
    position = 285, -118
    halign = center
    valign = center
    zindex = 12
}

# Bluetooth device
label {
    monitor =
    text = cmd[update:5000] b=$(bluetoothctl info 2>/dev/null | awk -F': ' '/Name:/{print $2; exit}' | cut -c1-14); [ -z "$b" ] && echo "Disconnected" || echo "$b"
    color = rgba(17, 17, 27, 0.75)
    font_size = 10
    font_family = $font Bold
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

############################
###       BATTERY        ###
############################

shape {
    monitor =
    size = 320, 95
    color = rgba(243, 139, 168, 0.9)
    rounding = 22
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

# Battery icon background
shape {
    monitor =
    size = 34, 34
    color = rgba(17, 17, 27, 0.7)
    rounding = 17
    position = 145, -235
    halign = center
    valign = center
    zindex = 12
}

# Battery icon
label {
    monitor =
    text = cmd[update:2000] s=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); [ "$s" = "Discharging" ] && echo "󰂃" || echo "󰂄"
    color = rgba(243, 139, 168, 1.0)
    font_size = 16
    font_family = $font
    position = 145, -235
    halign = center
    valign = center
    zindex = 13
}

# Battery percentage
label {
    monitor =
    text = cmd[update:2000] cat /sys/class/power_supply/BAT0/capacity 2>/dev/null | sed 's/$/%/'
    color = rgba(17, 17, 27, 0.85)
    font_size = 26
    font_family = $font ExtraBold
    position = 220, -235
    halign = center
    valign = center
    zindex = 12
}

# Battery status
label {
    monitor =
    text = cmd[update:2000] cat /sys/class/power_supply/BAT0/status 2>/dev/null
    color = rgba(17, 17, 27, 0.7)
    font_size = 10
    font_family = $font
    position = 220, -260
    halign = center
    valign = center
    zindex = 12
}