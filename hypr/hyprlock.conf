# ~/.config/hypr/hyprlock.conf
# Material You / Illogical Impulse-inspired lockscreen
# Tip: position values are offsets from the chosen alignment anchor.
#       For example, halign = center + position = 0, -150 places a widget
#       150px above the vertical center.

$wallpaper = $HOME/Pictures/Wallpapers/wallpaper.png

# ---------------------------------------------------------------------------
# Palette — Material 3 Dark
# ---------------------------------------------------------------------------
$font = Inter
$font_mono = JetBrainsMono Nerd Font

$primary = rgba(208, 188, 255, 1.0)       # #D0BCFF
$on_primary = rgba(56, 30, 114, 1.0)      # #381E72
$surface = rgba(28, 27, 31, 0.78)         # #1C1B1F, translucent surface
$on_surface = rgba(230, 225, 229, 1.0)    # #E6E1E5
$outline = rgba(147, 143, 153, 1.0)       # #938F99
$muted = rgba(202, 196, 208, 1.0)
$error = rgba(242, 184, 181, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

# ---------------------------------------------------------------------------
# Canvas — wallpaper with softened contrast and subtle grain.
# The wallpaper is the base layer; the widgets below provide the visual
# hierarchy. Blur is performed by Hyprland, so compositor blur must work.
# ---------------------------------------------------------------------------
background {
    monitor =
    path = $wallpaper
    color = rgba(28, 27, 31, 1.0)

    blur_passes = 3
    blur_size = 7
    noise = 0.025
    contrast = 0.88
    brightness = 0.72
    vibrancy = 0.12
    vibrancy_darkness = 0.08
}

# ---------------------------------------------------------------------------
# TIME — oversized M3-display-style clock.
# Change font_size to tune the display scale for your monitor.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_family = $font
    font_size = 112
    text_align = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.42)
    shadow_boost = 1.15

    position = 0, 170
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# DATE — quiet supporting line below the clock.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    color = $muted
    font_family = $font
    font_size = 20
    text_align = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.30)

    position = 0, 92
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# IDENTITY — user avatar.
# Hyprlock displays the image as supplied; use a pre-cropped circular PNG
# at ~/.face if you want a perfectly circular portrait on every version.
# If ~/.face does not exist, replace the path with your own avatar file.
# ---------------------------------------------------------------------------
image {
    monitor =
    path = $HOME/.face
    size = 96
    border_size = 3
    border_color = $primary
    position = 0, 12
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $on_surface
    font_family = $font
    font_size = 18
    text_align = center

    position = 0, -62
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back
    color = $muted
    font_family = $font
    font_size = 13
    text_align = center

    position = 0, -88
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# PASSWORD — pill-shaped field with authentication-state feedback.
# check_color = authentication is being checked; fail_color = wrong password.
# Empty-state visibility is handled by fade_on_empty / fade_timeout.
# ---------------------------------------------------------------------------
input-field {
    monitor =
    size = 360, 62
    outline_thickness = 2

    rounding = 20
    dots_rounding = -1
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    dots_fade_time = 180

    outer_color = $outline
    inner_color = $surface
    font_color = $on_surface
    font_family = $font
    placeholder_text = <i>Enter password</i>
    fade_on_empty = true
    fade_timeout = 1200
    hide_input = false

    check_color = $primary
    check_text = Verifying…
    fail_color = $error
    fail_text = <i>Try again  •  $ATTEMPTS</i>
    fail_timeout = 2000
    fail_transition = 250
    capslock_color = $error

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.32)
    shadow_boost = 1.1

    position = 0, -160
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# BOTTOM STATUS — MPRIS track if available, otherwise a battery reading.
# playerctl and /sys/class/power_supply/BAT0 are optional system dependencies.
# If your battery has another name (e.g. BAT1), adjust the path below.
# This command refreshes every 5 seconds and never requires a network call.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] sh -c 'track="$(playerctl metadata --format "{{artist}} — {{title}}" 2>/dev/null)"; if [ -n "$track" ]; then printf "♫  %s" "$track"; elif [ -r /sys/class/power_supply/BAT0/capacity ]; then printf "Battery  ·  %s%%" "$(cat /sys/class/power_supply/BAT0/capacity)"; else printf "System locked"; fi'
    color = $muted
    font_family = $font
    font_size = 13
    text_align = center

    position = 0, 34
    halign = center
    valign = bottom
}

# ---------------------------------------------------------------------------
# OPTIONAL ACCENT SURFACE
# Hyprlock's widgets are not true glass panels; this small shape adds a
# subtle M3-style outline behind the password area. Disable if it overlaps
# with your chosen layout or if your installed version lacks shape support.
# ---------------------------------------------------------------------------
shape {
    monitor =
    size = 410, 82
    rounding = 28
    color = rgba(28, 27, 31, 0.30)
    border_size = 1
    border_color = rgba(147, 143, 153, 0.32)
    position = 0, -160
    halign = center
    valign = center
    zindex = -1
}
