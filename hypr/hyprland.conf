# ~/.config/hypr/hyprland.conf
# Hyprland main config — Material 3 starter.
#
# Hyprland only parses its own `key = value` format (plus conf-style blocks),
# so the modular files sourced below are plain .conf files, not Lua.

# Modular includes -----------------------------------------------------------
source = ~/.config/hypr/hyprland/env.conf
source = ~/.config/hypr/hyprland/general.conf
source = ~/.config/hypr/hyprland/rules.conf
source = ~/.config/hypr/hyprland/execs.conf
source = ~/.config/hypr/hyprland/shortcuts.conf
