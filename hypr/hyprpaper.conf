# ~/.config/hypr/hyprpaper.conf
# Fallback wallpaper daemon used when `swww` is not installed.
# hypr/hyprland/execs.conf starts `hyprpaper` automatically and then runs
# wallpaper_manager.py restore, which loads the remembered wallpaper through
# `hyprctl hyprpaper ...`. These defaults only need to make the daemon usable;
# the actual image is set at runtime, so no `preload`/`wallpaper` lines are
# required here (they would hard-code a path that may not exist).
splash = false
ipc = on
