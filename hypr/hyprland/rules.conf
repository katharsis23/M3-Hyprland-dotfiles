# ~/.config/hypr/hyprland/rules.conf
# Window rules & Quickshell layer rules.

# ---------------------------------------------------------------------------
# Layer rules (blur for the shell surfaces)
# ---------------------------------------------------------------------------
layerrule = blur, quickshell
layerrule = ignorezero, quickshell
layerrule = blur, gtk-layer-shell

layerrule = blur, m3shell-bar
layerrule = blur, m3shell-quicksettings
layerrule = blur, m3shell-sidebar
layerrule = noanim, m3shell-clock

# NOTE: no `blur` rule for m3shell-clock on purpose. The desktop clock is a
# full-screen transparent window on the bottom layer, so a `blur` layerrule
# makes Hyprland blur the *entire* wallpaper behind it — toggling "Desktop
# clock" would then blur the whole background. The clock stays legible on any
# wallpaper because its text is tinted from the matugen palette (see
# shell/qt/windows/DesktopClock.qml) instead of relying on a backdrop blur.

layerrule = ignorealpha 0.2, m3shell-quicksettings
layerrule = ignorealpha 0.2, m3shell-sidebar
layerrule = blur, notifications
layerrule = blur, fuzzel
layerrule = blur, rofi

# ---------------------------------------------------------------------------
# Float utility dialogs & file choosers
# ---------------------------------------------------------------------------
windowrulev2 = float, class:^(org\.kde\.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:(.*File Explorer.*)
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = float, title:^(Open Files)$
windowrulev2 = float, title:^(Save Files)$

# ---------------------------------------------------------------------------
# Tiling exceptions
# ---------------------------------------------------------------------------
windowrulev2 = suppressevent maximize, class:.*

# ---------------------------------------------------------------------------
# Picture-in-Picture
# ---------------------------------------------------------------------------
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 72% 70%, title:^(Picture-in-Picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture)$

# ---------------------------------------------------------------------------
# Terminal opacity
# ---------------------------------------------------------------------------
windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(Alacritty)$
windowrulev2 = opacity 0.95 0.90, class:^(org\.wezfurlong\.wezterm)$
