# ~/.config/hypr/hyprland/general.conf
# Basic window behavior, layouts, input and visuals.

# ---------------------------------------------------------------------------
# Monitors
# ---------------------------------------------------------------------------
# Auto-configure every connected monitor at preferred resolution.
# Replace with explicit lines once you know your layout, e.g.:
#   monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = , preferred, auto, auto

# ---------------------------------------------------------------------------
# Input & keyboard
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    kb_options = grp:alt_shift_toggle, caps:escape
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true
    repeat_delay = 300
    repeat_rate = 45

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 0.9
    }
}

# Per-device tuning example (get the name with `hyprctl devices`):
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }

# ---------------------------------------------------------------------------
# General layout
# ---------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(d0bcfffe) rgba(a8c7fffe) 45deg
    col.inactive_border = rgba(49454fff)
    layout = dwindle
    resize_on_border = true
    no_focus_fallback = false
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

# ---------------------------------------------------------------------------
# Decorations & glass effects
# ---------------------------------------------------------------------------
decoration {
    rounding = 16
    active_opacity = 0.98
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.03
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        popups = true
    }
}

# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------
animations {
    enabled = true

    bezier = m3_standard,   0.2,  0.0, 0.0,  1.0
    bezier = m3_decelerate, 0.05, 0.7, 0.1,  1.0
    bezier = m3_accelerate, 0.3,  0.0, 0.8,  0.15
    bezier = m3_emphasized, 0.05, 0.7, 0.1,  1.0
    bezier = overshoot,     0.13, 0.99, 0.29, 1.1
    bezier = linear,        0.0,  0.0, 1.0,  1.0

    animation = windows,          1, 4,  m3_decelerate, popin 80%
    animation = windowsIn,        1, 4,  m3_decelerate, popin 85%
    animation = windowsOut,       1, 3,  m3_accelerate, popin 85%
    animation = windowsMove,      1, 4,  m3_standard,
    animation = border,           1, 5,  m3_standard,
    animation = borderangle,      1, 60, linear,        loop
    animation = fade,             1, 4,  m3_standard,
    animation = fadeIn,           1, 4,  m3_decelerate,
    animation = fadeOut,          1, 3,  m3_accelerate,
    animation = fadeSwitch,       1, 3,  m3_standard,
    animation = fadeShadow,       1, 3,  m3_standard,
    animation = fadeDim,          1, 3,  m3_standard,
    animation = workspaces,       1, 5,  overshoot,     slide
    animation = specialWorkspace, 1, 4,  m3_decelerate, slidevert
    animation = layers,           1, 4,  m3_decelerate, popin 90%
}

# ---------------------------------------------------------------------------
# Layouts
# ---------------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    force_split = 2
    special_scale_factor = 0.85
}

master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

# ---------------------------------------------------------------------------
# Cursor
# ---------------------------------------------------------------------------
cursor {
    no_hardware_cursors = 0
    enable_hyprcursor = true
    sync_gsettings_theme = true
    no_warps = false
    warp_on_change_workspace = 2
}

# ---------------------------------------------------------------------------
# Gestures
# ---------------------------------------------------------------------------
gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_forever = true
    workspace_swipe_cancel_ratio = 0.15
}

# ---------------------------------------------------------------------------
# Ecosystem / tunables
# ---------------------------------------------------------------------------
ecosystem {
    no_update_news = false
    no_donation_nag = true
}

xwayland {
    force_zero_scaling = true
}
