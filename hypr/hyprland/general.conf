# ~/.config/hypr/hyprland/general.conf
# Basic window behavior, layouts, input and visuals.
 
# ---------------------------------------------------------------------------
# Monitors
# ---------------------------------------------------------------------------
# Auto-configure every connected monitor at preferred resolution.
# Replace with explicit lines once you know your layout, e.g.:
#   monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = , preferred, auto, auto
 
# ---------------------------------------------------------------------------
# Input & keyboard
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    kb_options = grp:alt_shift_toggle, caps:escape
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true
    repeat_delay = 300
    repeat_rate = 45
 
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 0.9
    }
}
 
# Per-device tuning example (get the name with `hyprctl devices`):
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }
 
# ---------------------------------------------------------------------------
# General layout
# ---------------------------------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    # Neutral, single-colour borders (no gradient, no rotating angle)
    col.active_border = rgba(e6e1e5cc)
    col.inactive_border = rgba(2b293000)
    layout = dwindle
    resize_on_border = true
    no_focus_fallback = false
    extend_border_grab_area = 15
    hover_icon_on_border = true
}
 
# ---------------------------------------------------------------------------
# Decorations & glass effects
# ---------------------------------------------------------------------------
decoration {
    rounding = 14
    rounding_power = 3.0
    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0
 
    # Subtly dim unfocused windows so focus is obvious without colour
    dim_inactive = true
    dim_strength = 0.07
 
    shadow {
        enabled = true
        range = 32
        render_power = 4
        offset = 0 8
        scale = 0.97
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }
 
    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02
        contrast = 0.95
        brightness = 0.92
        vibrancy = 0.18
        vibrancy_darkness = 0.1
        special = true
        popups = true
        popups_ignorealpha = 0.2
    }
}
 
# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------
animations {
    enabled = true
 
    bezier = m3_standard,   0.2,  0.0,  0.0,  1.0
    bezier = m3_decelerate, 0.05, 0.7,  0.1,  1.0
    bezier = m3_accelerate, 0.3,  0.0,  0.8,  0.15
    bezier = m3_emphasized, 0.05, 0.7,  0.1,  1.0
    bezier = smooth,        0.25, 0.1,  0.25, 1.0
    bezier = overshoot,     0.13, 0.99, 0.29, 1.08
    bezier = linear,        0.0,  0.0,  1.0,  1.0
 
    animation = windows,          1, 5,  m3_decelerate, popin 88%
    animation = windowsIn,        1, 5,  m3_decelerate, popin 88%
    animation = windowsOut,       1, 4,  m3_accelerate, popin 90%
    animation = windowsMove,      1, 5,  smooth
    animation = border,           1, 8,  m3_standard
    animation = fade,             1, 5,  smooth
    animation = fadeIn,           1, 5,  m3_decelerate
    animation = fadeOut,          1, 4,  m3_accelerate
    animation = fadeSwitch,       1, 4,  m3_standard
    animation = fadeShadow,       1, 4,  m3_standard
    animation = fadeDim,          1, 5,  m3_standard
    animation = workspaces,       1, 6,  overshoot,     slide
    animation = specialWorkspace, 1, 5,  m3_decelerate, slidevert
    animation = layers,           1, 5,  m3_decelerate, popin 92%
}
 
# ---------------------------------------------------------------------------
# Layouts
# ---------------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    force_split = 2
    special_scale_factor = 0.85
}
 
master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}
 
# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}
 
# ---------------------------------------------------------------------------
# Cursor
# ---------------------------------------------------------------------------
cursor {
    no_hardware_cursors = 0
    enable_hyprcursor = true
    sync_gsettings_theme = true
    no_warps = false
    warp_on_change_workspace = 2
    inactive_timeout = 4
    hide_on_key_press = true
}
 
# ---------------------------------------------------------------------------
# Gestures
# ---------------------------------------------------------------------------
gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_forever = true
    workspace_swipe_cancel_ratio = 0.15
}
 
# ---------------------------------------------------------------------------
# Ecosystem / tunables
# ---------------------------------------------------------------------------
ecosystem {
    no_update_news = false
    no_donation_nag = true
}
 
xwayland {
    force_zero_scaling = true
}
 