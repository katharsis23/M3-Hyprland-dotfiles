# ~/.config/hypr/hyprland/execs.conf
# exec-once daemons & autostart.

# --- Wayland authentication & environment import ----------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# --- Quickshell UI ----------------------------------------------------------
# Config name is the path under ~/.config/quickshell/: the installer links
# ~/.config/quickshell/material-hyprland -> repo/shell, and the QML entry point
# is shell.qml inside qt/, so the config is "material-hyprland/qt" (plain
# "material-hyprland" has no shell.qml at its root and quickshell refuses it).
# `qs` is launched by `sh` with stdout/stderr on the log; a failed start
# (missing imports/fonts) then leaves a trace instead of dying silently.
exec-once = /bin/sh -c 'mkdir -p "$HOME/.cache/material-hyprland"; qs -c material-hyprland/qt >> "$HOME/.cache/material-hyprland/quickshell.log" 2>&1'

# --- Notifications ----------------------------------------------------------
# Quickshell owns notifications; uncomment dunst only if you drop its QML part.
#exec-once = dunst

# --- Polkit agents (first one that exists wins; errors are harmless) --------
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# --- Network & Bluetooth applets -------------------------------------------
exec-once = nm-applet --indicator
exec-once = blueman-applet

# --- SSH & GPG agents -------------------------------------------------------
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/bin/ssh-agent -a $XDG_RUNTIME_DIR/ssh-agent.socket

# --- Portals ----------------------------------------------------------------
exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = /usr/libexec/xdg-desktop-portal

# --- Wallpaper daemon (awww/swww preferred, hyprpaper fallback) -------------
# swww was renamed to awww; start whichever daemon exists (awww first). If
# neither swww/awww is installed, fall back to hyprpaper. wallpaper_manager.py
# also lazy-starts the chosen daemon and applies the remembered wallpaper.
exec-once = /bin/sh -c 'command -v awww-daemon >/dev/null 2>&1 && awww-daemon'
exec-once = /bin/sh -c 'command -v swww-daemon >/dev/null 2>&1 && swww-daemon --format xrgb'
exec-once = /bin/sh -c 'command -v hyprpaper >/dev/null 2>&1 && ! pgrep -x hyprpaper >/dev/null 2>&1 && [ -z "$$(command -v awww-daemon)$$(command -v swww-daemon)" ] && hyprpaper'
# Give the daemon a moment to come up, then apply the remembered wallpaper.
exec-once = sleep 1 && ~/.config/hypr/scripts/wallpaper_manager.py restore

# --- Clipboard manager ------------------------------------------------------
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Audio & power daemons --------------------------------------------------
# pipewire/wireplumber usually run as systemd user units; these are fallbacks.
exec-once = pipewire
exec-once = wireplumber
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent 2>/dev/null || true

# --- Cursor theme sync ------------------------------------------------------
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

