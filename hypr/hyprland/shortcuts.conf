# ~/.config/hypr/hyprland/shortcuts.conf
# Modular keybinds. Syntax: bind = MODS, KEY, dispatcher, params
# Modifiers are comma-less (SUPER SHIFT), workspaces 1-10 map to keys 1-0.

$mod = SUPER

$terminal = kitty
$filemanager = nemo
$browser = firefox
$launcher = fuzzel
$qs = qs -c material-hyprland

# ---------------------------------------------------------------------------
# Core applications
# ---------------------------------------------------------------------------
bind = $mod, RETURN, exec, $terminal
bind = $mod, E, exec, $filemanager
bind = $mod, B, exec, $browser
bind = $mod, SPACE, exec, $launcher
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo,
bind = $mod SHIFT, P, pin,

# ---------------------------------------------------------------------------
# Quickshell & utility shortcuts
# ---------------------------------------------------------------------------
bind = $mod, SLASH, exec, $qs ipc call shell toggleShortcuts
bind = $mod, S, exec, $qs ipc call shell toggleSettings
bind = $mod, D, exec, $qs ipc call shell toggleSidebar
bind = $mod, N, exec, $qs ipc call shell toggleQuickSettings
bind = $mod, COMMA, exec, $qs ipc call shell toggleCalendar
bind = $mod, G, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mod, L, exec, hyprlock

# ---------------------------------------------------------------------------
# Screenshots & clipboard
# ---------------------------------------------------------------------------
bind = , PRINT, exec, grimblast copy area
bind = SHIFT, PRINT, exec, grimblast copy screen
bind = $mod, PRINT, exec, grimblast save area
bind = $mod SHIFT, C, exec, hyprpicker -a
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper_manager.py random

# ---------------------------------------------------------------------------
# Navigation & focus
# ---------------------------------------------------------------------------
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize active window (repeatable)
bind = $mod CTRL, left,  resizeactive, -40 0, repeating
bind = $mod CTRL, right, resizeactive, 40 0,  repeating
bind = $mod CTRL, up,    resizeactive, 0 -40, repeating
bind = $mod CTRL, down,  resizeactive, 0 40,  repeating

# Window cycling
bind = $mod, TAB, cyclenext,
bind = $mod, GRAVE, cyclenext,
bind = $mod SHIFT, TAB, focuswindow, previous

# Scratchpad (special workspace)
bind = $mod, X, togglespecialworkspace, magic
bind = $mod SHIFT, X, movetoworkspace, special:magic

# Dwindle split toggle
bind = $mod, M, togglesplit,

# ---------------------------------------------------------------------------
# Workspaces 1..10
# ---------------------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
# Mouse drag: SUPER + LMB moves, SUPER + RMB resizes (bindm mouse binds)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---------------------------------------------------------------------------
# Media & system keys
# ---------------------------------------------------------------------------
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
