# ~/.config/hypr/hyprland/env.conf
# System & toolkit environment variables.
# (Hyprland must be started from a clean session for these to apply.)

# --- Wayland & Qt -----------------------------------------------------------
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# --- Cursor & desktop -------------------------------------------------------
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,26
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,26

# --- XDG --------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Toolkit backends -------------------------------------------------------
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM_PLUGIN_PATH,/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms

# --- Misc fixes -------------------------------------------------------------
env = _JAVA_AWT_WM_NONREPARENTING,1

# --- Application preferences (read by shell/scripts) ------------------------
env = BROWSER_DEFAULT,firefox
env = TERMINAL_DEFAULT,kitty
env = FILE_MANAGER_DEFAULT,nemo
env = CODE_EDITOR_DEFAULT,code

# --- GPU / hardware acceleration (uncomment what matches your system) -------
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,iHD        # Intel iGPU
#env = LIBVA_DRIVER_NAME,radeonsi   # AMD